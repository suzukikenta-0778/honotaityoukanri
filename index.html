<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>体調管理ノート</title>
<meta name="theme-color" content="#1F6F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="体調ノート">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#1B2422; --muted:#5A6764; --line:#D3DAD8;
  --accent:#1F6F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEDEB;
  --warn-bg:#FBE7C8; --warn-ink:#7A4200; --warn-line:#E2A650;
  --font:Meiryo,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121817; --surface:#1B2322; --ink:#E6EEEC; --muted:#9BAAA6; --line:#2F3B39;
    --accent:#5BC2BA; --accent-ink:#0B1413; --accent-soft:#1F3533;
    --warn-bg:#4A3416; --warn-ink:#FFCB86; --warn-line:#A8741F; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-top:max(12px, env(safe-area-inset-top, 0px));
  padding-bottom:max(40px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}
.status{font-size:12px;color:var(--muted);text-align:right;min-height:18px}
.status.err{color:var(--warn-ink);background:var(--warn-bg);padding:2px 8px;border-radius:6px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;font-size:13px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .label{flex:1;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:focus-visible,.day:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,input:focus-visible,textarea:focus-visible,tr[data-k]:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.summary{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.tabs{display:flex;background:var(--accent-soft);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{margin-bottom:4px}
.wd span{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:2px 0}
.day{min-height:60px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day .n{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.day .t{font-size:12px;font-variant-numeric:tabular-nums}
.day .m{font-size:11px;color:var(--accent);line-height:1}
.day.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.day.warn .m,.day.warn .t{color:var(--warn-ink);font-weight:700}
.day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.day.sel{border:2px solid var(--accent);padding:3px 1px}
.blank{min-height:60px}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.listwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);background:var(--accent-soft)}
thead tr.sub th{border-top:1px solid var(--line)}
.gseg{margin-bottom:8px}
.gseg button{min-height:40px;font-size:13px}
#gwrap svg{display:block;width:100%;height:auto}
.g-grid{stroke:var(--line);stroke-width:1}
.g-ref{stroke:var(--warn-line);stroke-width:1.3;stroke-dasharray:4 3}
.g-line{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round}
.g-txt{fill:var(--muted);font-size:10px;font-family:var(--font)}
.g-reftxt{fill:var(--warn-ink);font-size:10px;font-family:var(--font);font-weight:700}
.g-pt{fill:var(--accent);stroke:var(--surface);stroke-width:1}
.g-pt.hot{fill:var(--warn-line);stroke:var(--warn-ink)}
.g-sel{fill:none;stroke:var(--ink);stroke-width:1.6}
#gwrap g[data-p]{cursor:pointer}
.gdetail{margin-top:8px;padding:10px 12px;background:var(--accent-soft);border-radius:10px;font-size:13px;min-height:40px;overflow-wrap:anywhere}
.sect{margin:4px 0 -4px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.sect small{margin-left:8px;font-size:12px;font-weight:400;color:var(--muted)}
th.memo,td.memo{min-width:220px}
td.memo{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
th.ext,td.ext{min-width:150px}
td.ext{white-space:normal;font-size:12px;line-height:1.4}
tr[data-k]{cursor:pointer}
tr.sel td{background:var(--accent-soft)}
td.bad{background:var(--warn-bg);color:var(--warn-ink);font-weight:700}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.edhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.edhead h2{margin:0;font-size:18px;font-weight:700}
.temps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{min-width:0}
.tin span{flex:none}
.field label,.field .lab{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.tin{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.tin input{flex:1;min-width:0;border:0;background:transparent;font-size:22px;min-height:50px;font-variant-numeric:tabular-nums}
.tin input:focus-visible{outline:none}
.tin:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.tin.hot{border-color:var(--warn-line);background:var(--warn-bg)}
.hint{font-size:12px;color:var(--warn-ink);min-height:16px}
.exrow{margin-top:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.exline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.exmemo{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;min-height:46px;font-size:16px}
.exrow .tin input{font-size:20px;min-height:46px}
.exdel{padding:0;min-height:46px}
.exrow .tin{padding:0 8px}
.exrow input[type=time]{font-size:17px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].bad{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.seg button[aria-pressed="true"].bad::before{content:"▲ "}
.seg button[aria-pressed="true"]:not(.bad)::before{content:"✓ "}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);resize:vertical;font-size:16px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:8px;font-size:12px}
.gate{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;font-size:18px}
.gate p{margin:0;font-size:13px;color:var(--muted)}
.gate input{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;min-height:50px;font-size:18px;width:100%}
.gate .err{color:var(--warn-ink);font-size:13px;min-height:18px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<section class="gate" id="gate" hidden>
  <h2>合言葉を入力</h2>
  <p>2人だけが知っている合言葉を決めて入力してください。同じ合言葉を入力した端末同士で記録が共有されます。10文字以上にしてください。</p>
  <label for="pass" style="font-size:13px;color:var(--muted);font-weight:700">合言葉</label>
  <input id="pass" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
  <div class="err" id="gateerr" role="alert"></div>
  <button class="btn primary" id="gatego">開く</button>
</section>

<main class="app" id="app" hidden>
  <div class="top">
    <h1>体調管理ノート</h1>
    <div class="status" id="status" role="status" aria-live="polite">読み込み中…</div>
  </div>
  <div class="banner" id="banner" hidden></div>

  <div class="monthbar">
    <button class="btn" id="prev" aria-label="前の月">◀</button>
    <div class="label" id="mlabel"></div>
    <button class="btn" id="next" aria-label="次の月">▶</button>
    <button class="btn" id="todaybtn">今日</button>
  </div>
  <div class="summary" id="summary"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-cal" aria-selected="true" data-tab="cal">カレンダー</button>
    <button role="tab" id="tab-list" aria-selected="false" data-tab="list">一覧</button>
    <button role="tab" id="tab-graph" aria-selected="false" data-tab="graph">グラフ</button>
  </div>

  <section id="view-cal" class="cal">
    <div class="wd"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="grid" id="grid"></div>
    <p class="legend">日付をタップして記入します。▲は気になる日（37.5℃以上、元気・食欲なし、咳・鼻水あり、いつもと違う）、○は記入済みです。</p>
  </section>
  <section id="view-list" class="listwrap" hidden>
    <table>
      <thead><tr><th rowspan="2">日</th><th rowspan="2">朝℃</th><th rowspan="2">夜℃</th><th rowspan="2" class="ext">追加測定</th><th colspan="5">朝の様子</th><th rowspan="2" class="memo">メモ</th></tr><tr class="sub"><th>元気</th><th>咳</th><th>鼻水</th><th>食欲</th><th>いつもと</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <section id="view-graph" class="cal" hidden>
    <div class="seg gseg" role="group" aria-label="表示期間">
      <button type="button" data-g="month" aria-pressed="true">この月</button>
      <button type="button" data-g="week" aria-pressed="false">選択日までの7日間</button>
    </div>
    <div id="gwrap"></div>
    <p class="legend">● 朝　■ 夜　▲ 追加測定　点線は37.5℃の目安です。オレンジの点は37.5℃以上です。</p>
    <p class="legend" id="gnote"></p>
    <div class="gdetail" id="gdetail" aria-live="polite">点をタップすると、時刻とメモが出ます。</div>
  </section>

  <section class="editor" id="editor" aria-label="日ごとの記入">
    <div class="edhead">
      <button class="btn" id="dprev" aria-label="前の日">◀</button>
      <h2 id="edtitle"></h2>
      <button class="btn" id="dnext" aria-label="次の日">▶</button>
    </div>
    <div class="temps">
      <div class="field">
        <label for="am">朝の体温</label>
        <div class="tin" id="tin-am"><input id="am" type="text" inputmode="decimal" autocomplete="off"><span>℃</span></div>
      </div>
      <div class="field">
        <label for="pm">夜の体温</label>
        <div class="tin" id="tin-pm"><input id="pm" type="text" inputmode="decimal" autocomplete="off"><span>℃</span></div>
      </div>
    </div>
    <div class="hint" id="temphint"></div>
    <div class="field">
      <span class="lab" id="lab-extra">追加の体温（発熱時など）</span>
      <div id="extras" role="group" aria-labelledby="lab-extra"></div>
      <button type="button" class="btn" id="addextra" style="width:100%;margin-top:8px">＋ 体温と時刻を追加</button>
    </div>
    <h3 class="sect">朝の様子<small>朝の時点の状態を記入します</small></h3>
    <div id="choices" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="field">
      <label for="memo">メモ</label>
      <textarea id="memo" placeholder="様子、服薬、受診など"></textarea>
    </div>
  </section>

  <div class="foot"><button class="linkbtn" id="resetroom" hidden>合言葉を変更する</button></div>
</main>

<script>
(function(){
  var WD=['日','月','火','水','木','金','土'];
  var CH=[
    {f:'genki',label:'元気',opts:['ある','ない'],bad:'ない'},
    {f:'seki',label:'咳',opts:['ある','ない'],bad:'ある'},
    {f:'hana',label:'鼻水',opts:['ある','ない'],bad:'ある'},
    {f:'shoku',label:'食欲',opts:['ある','ない'],bad:'ない'},
    {f:'itsumo',label:'いつもと体調',opts:['同じ','違う'],bad:'違う'}
  ];
  var ROOM_KEY='taichou-room-v1';
  var pad=function(n){return String(n).padStart(2,'0')};
  var keyOf=function(y,m,d){return y+'-'+pad(m)+'-'+pad(d)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

  var now=new Date();
  var todayKey=keyOf(now.getFullYear(),now.getMonth()+1,now.getDate());
  var state={y:now.getFullYear(),m:now.getMonth()+1,sel:todayKey,docs:{},tab:'cal',grange:'month'};
  var store=null, pending={}, firstSnap=false, slow=0;

  function parseKey(k){var p=k.split('-');return {y:+p[0],m:+p[1],d:+p[2]}}
  function dayLabel(k){var p=parseKey(k);var w=new Date(p.y,p.m-1,p.d).getDay();return p.m+'月'+p.d+'日（'+WD[w]+'）'}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
  function exList(d){return (d&&Array.isArray(d.extra))?d.extra.filter(function(x){return x&&typeof x==='object'}):[]}
  function norm(s){
    return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/[．。，,]/g,'.').replace(/[^0-9.]/g,'');
  }
  function concerns(d){
    if(!d) return false;
    var a=num(d.am),p=num(d.pm);
    if((a!==null&&a>=37.5)||(p!==null&&p>=37.5)) return true;
    if(exList(d).some(function(x){var v=num(x.v);return v!==null&&v>=37.5})) return true;
    return CH.some(function(c){return d[c.f]===c.bad});
  }
  function recorded(d){
    if(!d) return false;
    return !!(d.am||d.pm||d.memo||CH.some(function(c){return d[c.f]})||exList(d).some(function(x){return x.v||x.m}));
  }
  function maxTemp(d){
    if(!d) return null;
    var a=num(d.am),p=num(d.pm);
    var vals=[a,p].concat(exList(d).map(function(x){return num(x.v)})).filter(function(v){return v!==null});
    if(!vals.length) return null;
    return Math.max.apply(null,vals);
  }
  function setStatus(t,err){var s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
  function showBanner(t){var b=$('banner');if(t){b.textContent=t;b.hidden=false}else{b.hidden=true}}

  /* ---------- storage adapters ---------- */
  function localStore(){
    var KEY='taichou-local-v1', data={}, cb=null;
    try{data=JSON.parse(lsGet(KEY)||'{}')}catch(e){data={}}
    return {
      mode:'local',
      subscribe:function(next){
        cb=next; next(JSON.parse(JSON.stringify(data)),false,false);
        return function(){};
      },
      write:function(k,patch){
        data[k]=Object.assign({},data[k]||{},patch);
        if(!lsSet(KEY,JSON.stringify(data))) return Promise.reject(new Error('storage'));
        if(cb) cb(JSON.parse(JSON.stringify(data)),false,false);
        return Promise.resolve();
      }
    };
  }
  function cloudStore(room){
    var cfg=window.FIREBASE_CONFIG;
    firebase.initializeApp(cfg);
    var fs=firebase.firestore();
    try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    var col=fs.collection('rooms').doc(room).collection('days');
    return {
      mode:'cloud',
      subscribe:function(next,err){
        return col.onSnapshot({includeMetadataChanges:true},function(s){
          var o={}; s.forEach(function(d){o[d.id]=d.data()});
          next(o,s.metadata.fromCache,s.metadata.hasPendingWrites);
        },err);
      },
      write:function(k,patch){
        // 通信できないときも端末内に溜まり、つながったら自動で送られます
        col.doc(k).set(patch,{merge:true}).catch(function(){setStatus('保存できませんでした。通信と合言葉を確認してください',true)});
        return Promise.resolve();
      }
    };
  }
  function sha(s){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('');
    });
  }

  /* ---------- rendering ---------- */
  function renderMonth(){
    $('mlabel').textContent=state.y+'年'+state.m+'月';
    var first=new Date(state.y,state.m-1,1).getDay();
    var dim=new Date(state.y,state.m,0).getDate();
    var html='',i,k,d,rec=0,warn=0;
    for(i=0;i<first;i++) html+='<span class="blank"></span>';
    for(i=1;i<=dim;i++){
      k=keyOf(state.y,state.m,i); d=state.docs[k];
      var w=concerns(d), r=recorded(d), t=maxTemp(d);
      if(r) rec++; if(w) warn++;
      var cls='day'+(w?' warn':'')+(k===todayKey?' today':'')+(k===state.sel?' sel':'');
      html+='<button class="'+cls+'" data-k="'+k+'" aria-label="'+esc(dayLabel(k))+(w?'、気になる点あり':(r?'、記入済み':''))+'" aria-pressed="'+(k===state.sel)+'">'
        +'<span class="n">'+i+'</span>'
        +'<span class="t">'+(t!==null?t.toFixed(1):'&nbsp;')+'</span>'
        +'<span class="m">'+(w?'▲':(r?'○':'&nbsp;'))+'</span></button>';
    }
    $('grid').innerHTML=html;
    $('summary').innerHTML='<span>記入 '+rec+'日</span><span>気になる日 '+warn+'日</span>';

    var rows='';
    for(i=1;i<=dim;i++){
      k=keyOf(state.y,state.m,i); d=state.docs[k]||{};
      var wd=WD[new Date(state.y,state.m-1,i).getDay()];
      var a=num(d.am),p=num(d.pm);
      var ex=exList(d).filter(function(x){return x.v||x.m}).sort(function(x,y){return String(x.t||'').localeCompare(String(y.t||''))});
      var exHot=ex.some(function(x){var v=num(x.v);return v!==null&&v>=37.5});
      var exHtml=ex.map(function(x){return esc([x.t||'--:--',x.v||'',x.m||''].filter(Boolean).join(' '))}).join('<br>');
      rows+='<tr data-k="'+k+'" tabindex="0" class="'+(k===state.sel?'sel':'')+'"><td>'+i+'（'+wd+'）</td>'
        +'<td class="'+(a!==null&&a>=37.5?'bad':'')+'">'+esc(d.am||'')+'</td>'
        +'<td class="'+(p!==null&&p>=37.5?'bad':'')+'">'+esc(d.pm||'')+'</td>'
        +'<td class="ext'+(exHot?' bad':'')+'">'+exHtml+'</td>'
        +CH.map(function(c){return '<td class="'+(d[c.f]===c.bad?'bad':'')+'">'+esc(d[c.f]||'')+'</td>'}).join('')
        +'<td class="memo">'+esc(d.memo||'')+'</td></tr>';
    }
    $('tbody').innerHTML=rows;
    if(state.tab==='graph') renderGraph();
  }
  var gsig='';
  function renderGraph(){
    var n,start,sp=parseKey(state.sel);
    if(state.grange==='week'){n=7;start=new Date(sp.y,sp.m-1,sp.d-6)}
    else{n=new Date(state.y,state.m,0).getDate();start=new Date(state.y,state.m-1,1)}
    var okv=function(v){return v!==null&&v>=30&&v<=45};
    var pts=[];
    for(var i=0;i<n;i++){
      var dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      var k=keyOf(dt.getFullYear(),dt.getMonth()+1,dt.getDate()), d=state.docs[k];
      if(!d) continue;
      var md=(dt.getMonth()+1)+'/'+dt.getDate();
      var a=num(d.am); if(okv(a)) pts.push({x:i+0.3,v:a,kind:'am',label:md+' 朝',k:k,memo:''});
      var pv=num(d.pm); if(okv(pv)) pts.push({x:i+0.85,v:pv,kind:'pm',label:md+' 夜',k:k,memo:''});
      exList(d).forEach(function(e){
        var v=num(e.v); if(!okv(v)) return;
        var m=/^(\d{1,2}):(\d{2})$/.exec(e.t||'');
        var f=m?(+m[1]*60+ +m[2])/1440:0.5;
        pts.push({x:i+Math.min(0.98,f),v:v,kind:'ex',label:md+' 追加'+(e.t?' '+e.t:''),k:k,memo:e.m||''});
      });
    }
    pts.sort(function(p,q){return p.x-q.x});
    var W=360,H=240,L=34,R=10,T=12,B=28,pw=W-L-R,ph=H-T-B;
    var lo=35.5,hi=38.5;
    if(pts.length){
      var mn=Math.min.apply(null,pts.map(function(p){return p.v})), mx=Math.max.apply(null,pts.map(function(p){return p.v}));
      lo=Math.min(lo,Math.floor((mn-0.2)*2)/2); hi=Math.max(hi,Math.ceil((mx+0.2)*2)/2);
    }
    var X=function(x){return L+x/n*pw}, Y=function(v){return T+(hi-v)/(hi-lo)*ph};
    var step=(hi-lo)>3.5?1:0.5, out='';
    for(var g=Math.ceil(lo/step)*step;g<=hi+1e-9;g+=step){
      out+='<line class="g-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g).toFixed(1)+'" y2="'+Y(g).toFixed(1)+'"/>'
        +'<text class="g-txt" x="'+(L-5)+'" y="'+(Y(g)+3.5).toFixed(1)+'" text-anchor="end">'+g.toFixed(1)+'</text>';
    }
    out+='<line class="g-ref" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(37.5).toFixed(1)+'" y2="'+Y(37.5).toFixed(1)+'"/>';
    for(var j=0;j<n;j++){
      var dd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+j), dom=dd.getDate();
      var show=(state.grange==='week')||dom===1||dom%5===0;
      if(show) out+='<text class="g-txt" x="'+X(j+0.5).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+(state.grange==='week'?(dd.getMonth()+1)+'/'+dom:dom)+'</text>';
    }
    var segs=[],cur=[];
    pts.forEach(function(p){
      if(cur.length&&p.x-cur[cur.length-1].x>1.6){segs.push(cur);cur=[]}
      cur.push(p);
    });
    if(cur.length) segs.push(cur);
    segs.forEach(function(sg){
      if(sg.length>1) out+='<polyline class="g-line" points="'+sg.map(function(p){return X(p.x).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
    });
    var selText='';
    pts.forEach(function(p,idx){
      var cx=X(p.x).toFixed(1), cy=Y(p.v).toFixed(1), c='g-pt'+(p.v>=37.5?' hot':''), sig=p.kind+'|'+p.k+'|'+p.x.toFixed(3), shape;
      if(p.kind==='am') shape='<circle class="'+c+'" cx="'+cx+'" cy="'+cy+'" r="4.5"/>';
      else if(p.kind==='pm') shape='<rect class="'+c+'" x="'+(cx-4)+'" y="'+(cy-4)+'" width="8" height="8"/>';
      else shape='<polygon class="'+c+'" points="'+cx+','+(cy-5.5)+' '+(+cx+5)+','+(+cy+4)+' '+(cx-5)+','+(+cy+4)+'"/>';
      out+='<g data-p="'+idx+'" data-sig="'+sig+'"><circle cx="'+cx+'" cy="'+cy+'" r="13" fill="transparent"/>'+shape
        +(sig===gsig?'<circle class="g-sel" cx="'+cx+'" cy="'+cy+'" r="9"/>':'')+'</g>';
      if(sig===gsig) selText=p.label+'　'+p.v.toFixed(1)+'℃'+(p.memo?'　'+p.memo:'');
    });
    var note='';
    if(pts.length){
      var top=pts.reduce(function(a,b){return b.v>a.v?b:a});
      var hot=pts.filter(function(p){return p.v>=37.5}).length;
      note='最高 '+top.v.toFixed(1)+'℃（'+top.label+'）／37.5℃以上の測定 '+hot+'回';
    }else{
      note='この期間に記録された体温はありません。';
    }
    $('gwrap').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('体温の推移。'+note)+'">'+out+'</svg>';
    $('gnote').textContent=note;
    $('gdetail').textContent=selText||'点をタップすると、時刻とメモが出ます。';
  }
  function buildEditor(){
    $('choices').innerHTML=CH.map(function(c){
      return '<div class="field"><span class="lab" id="lab-'+c.f+'">'+c.label+'</span>'
        +'<div class="seg" role="group" aria-labelledby="lab-'+c.f+'">'
        +c.opts.map(function(o){return '<button type="button" data-f="'+c.f+'" data-v="'+o+'" class="'+(o===c.bad?'bad':'')+'" aria-pressed="false">'+o+'</button>'}).join('')
        +'</div></div>';
    }).join('');
  }
  function tempHints(){
    var msgs=[];
    ['am','pm'].forEach(function(f){
      var v=num($(f).value), box=$('tin-'+f), nm=(f==='am'?'朝':'夜');
      box.classList.toggle('hot',v!==null&&v>=37.5);
      if($(f).value&&(v===null||v<34||v>42)) msgs.push(nm+'の体温の数値を確認してください');
      else if(v!==null&&v>=37.5) msgs.push(nm+'は37.5℃以上です');
    });
    $('temphint').textContent=msgs.join('　');
  }
  function fillEditor(){
    var d=state.docs[state.sel]||{};
    $('edtitle').textContent=dayLabel(state.sel);
    ['am','pm','memo'].forEach(function(f){
      var el=$(f); if(document.activeElement!==el) el.value=d[f]||'';
    });
    CH.forEach(function(c){
      Array.prototype.forEach.call(document.querySelectorAll('.seg button[data-f="'+c.f+'"]'),function(b){
        b.setAttribute('aria-pressed',String(d[c.f]===b.getAttribute('data-v')));
      });
    });
    tempHints();
  }
  var exDay=null;
  function renderExtras(){
    var box=$('extras'), list=exList(state.docs[state.sel]);
    if(exDay===state.sel&&box.children.length===list.length){
      Array.prototype.forEach.call(box.querySelectorAll('input[data-x]'),function(inp){
        var x=list[+inp.getAttribute('data-i')]; if(!x) return;
        var f=inp.getAttribute('data-x');
        if(inp!==document.activeElement&&inp.value!==(x[f]||'')) inp.value=x[f]||'';
        if(f==='v'){var n=num(inp.value); inp.closest('.tin').classList.toggle('hot',n!==null&&n>=37.5)}
      });
      return;
    }
    exDay=state.sel;
    box.innerHTML=list.map(function(x,i){
      var n=num(x.v), hot=n!==null&&n>=37.5;
      return '<div class="exrow"><div class="exline">'
        +'<div class="tin"><input type="time" data-i="'+i+'" data-x="t" aria-label="'+(i+1)+'件目の測定時刻" value="'+esc(x.t||'')+'"></div>'
        +'<div class="tin'+(hot?' hot':'')+'"><input type="text" inputmode="decimal" autocomplete="off" data-i="'+i+'" data-x="v" aria-label="'+(i+1)+'件目の体温" value="'+esc(x.v||'')+'"><span>℃</span></div>'
        +'<button type="button" class="btn exdel" data-i="'+i+'" aria-label="'+(i+1)+'件目を削除">✕</button></div>'
        +'<input class="exmemo" type="text" autocomplete="off" data-i="'+i+'" data-x="m" aria-label="'+(i+1)+'件目の対応メモ" placeholder="対応メモ" value="'+esc(x.m||'')+'"></div>';
    }).join('');
  }
  function copyExtras(){return exList(state.docs[state.sel]).map(function(x){return {t:x.t||'',v:x.v||'',m:x.m||''}})}
  function renderAll(){renderMonth();fillEditor();renderExtras()}

  /* ---------- saving ---------- */
  function queue(k,patch,immediate){
    state.docs[k]=Object.assign({},state.docs[k]||{},patch);
    renderMonth();
    var p=pending[k]||(pending[k]={patch:{},timer:0});
    Object.assign(p.patch,patch);
    clearTimeout(p.timer);
    setStatus('入力中…');
    if(immediate) flush(k); else p.timer=setTimeout(function(){flush(k)},700);
  }
  function flush(k){
    var p=pending[k];
    if(!p||!Object.keys(p.patch).length||!store) return;
    clearTimeout(p.timer);
    var patch=p.patch; p.patch={};
    setStatus('保存中…');
    store.write(k,patch).then(function(){
      if(store.mode==='local') setStatus('保存しました（この端末のみ）');
    },function(){setStatus('保存できませんでした',true)});
  }
  function flushAll(){Object.keys(pending).forEach(flush)}

  /* ---------- events ---------- */
  function select(k,scroll){
    state.sel=k;
    var p=parseKey(k);
    state.y=p.y;state.m=p.m;
    renderAll();
    if(scroll){
      var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      $('editor').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
    }
  }
  function shiftDay(n){
    var p=parseKey(state.sel), dt=new Date(p.y,p.m-1,p.d+n);
    select(keyOf(dt.getFullYear(),dt.getMonth()+1,dt.getDate()),false);
  }
  function shiftMonth(n){
    var dt=new Date(state.y,state.m-1+n,1);
    state.y=dt.getFullYear();state.m=dt.getMonth()+1;
    var p=parseKey(state.sel);
    if(p.y!==state.y||p.m!==state.m){
      var last=new Date(state.y,state.m,0).getDate();
      state.sel=keyOf(state.y,state.m,Math.min(p.d,last));
    }
    renderAll();
  }
  function setTab(t){
    state.tab=t;
    $('view-cal').hidden=t!=='cal';
    $('view-list').hidden=t!=='list';
    $('view-graph').hidden=t!=='graph';
    $('tab-cal').setAttribute('aria-selected',String(t==='cal'));
    $('tab-list').setAttribute('aria-selected',String(t==='list'));
    $('tab-graph').setAttribute('aria-selected',String(t==='graph'));
    if(t==='graph') renderGraph();
  }
  $('view-graph').addEventListener('click',function(e){
    var gb=e.target.closest('button[data-g]');
    if(gb){
      state.grange=gb.getAttribute('data-g');
      Array.prototype.forEach.call(document.querySelectorAll('button[data-g]'),function(b){b.setAttribute('aria-pressed',String(b===gb))});
      gsig=''; renderGraph(); return;
    }
    var pt=e.target.closest('g[data-p]');
    if(pt){gsig=pt.getAttribute('data-sig'); renderGraph()}
  });
  $('prev').addEventListener('click',function(){shiftMonth(-1)});
  $('next').addEventListener('click',function(){shiftMonth(1)});
  $('dprev').addEventListener('click',function(){shiftDay(-1)});
  $('dnext').addEventListener('click',function(){shiftDay(1)});
  $('todaybtn').addEventListener('click',function(){select(todayKey,false)});
  document.querySelector('.tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(b) setTab(b.getAttribute('data-tab'));
  });
  $('grid').addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]'); if(b) select(b.getAttribute('data-k'),true);
  });
  $('tbody').addEventListener('click',function(e){
    var r=e.target.closest('tr[data-k]'); if(r) select(r.getAttribute('data-k'),true);
  });
  $('tbody').addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){var r=e.target.closest('tr[data-k]'); if(r){e.preventDefault();select(r.getAttribute('data-k'),true)}}
  });
  $('choices').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]'); if(!b) return;
    var f=b.getAttribute('data-f'), v=b.getAttribute('data-v');
    var cur=(state.docs[state.sel]||{})[f], patch={};
    patch[f]=(cur===v)?'':v;
    queue(state.sel,patch,true);
    fillEditor();
  });
  ['am','pm'].forEach(function(f){
    $(f).addEventListener('input',function(){
      var el=$(f), n=norm(el.value);
      if(n!==el.value) el.value=n;
      tempHints();
      var patch={}; patch[f]=el.value;
      queue(state.sel,patch,false);
    });
  });
  $('memo').addEventListener('input',function(){queue(state.sel,{memo:$('memo').value},false)});
  $('addextra').addEventListener('click',function(){
    var cur=copyExtras();
    if(cur.length>=20) return;
    var n=new Date();
    cur.push({t:pad(n.getHours())+':'+pad(n.getMinutes()),v:'',m:''});
    queue(state.sel,{extra:cur},true);
    renderExtras();
    var ins=$('extras').querySelectorAll('input[data-x="v"]');
    if(ins.length) ins[ins.length-1].focus();
  });
  $('extras').addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    var cur=copyExtras(); cur.splice(+b.getAttribute('data-i'),1);
    queue(state.sel,{extra:cur},true);
    renderExtras();
  });
  $('extras').addEventListener('input',function(e){
    var el=e.target, f=el.getAttribute('data-x'); if(!f) return;
    var i=+el.getAttribute('data-i'), val=el.value;
    if(f==='v'){
      var nv=norm(val); if(nv!==val){el.value=nv;val=nv}
      var n=num(val); el.closest('.tin').classList.toggle('hot',n!==null&&n>=37.5);
    }
    var cur=copyExtras(); if(!cur[i]) return;
    cur[i][f]=val;
    queue(state.sel,{extra:cur},false);
  });
  $('editor').addEventListener('focusout',function(){flush(state.sel)});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden') flushAll()});
  window.addEventListener('pagehide',flushAll);
  $('resetroom').addEventListener('click',function(){
    flushAll(); lsDel(ROOM_KEY); location.reload();
  });

  /* ---------- start ---------- */
  function onData(docs,fromCache,hasPending){
    Object.keys(pending).forEach(function(k){
      var p=pending[k]; if(p&&Object.keys(p.patch).length) docs[k]=Object.assign({},docs[k]||{},p.patch);
    });
    state.docs=docs;
    if(store.mode==='cloud'){
      if(hasPending) setStatus('送信中…（通信待ちの場合があります）');
      else if(!fromCache){firstSnap=true;clearTimeout(slow);setStatus('共有中（自動保存）')}
    }else{
      firstSnap=true;
      if(!/保存|入力/.test($('status').textContent)) setStatus('この端末のみ保存');
    }
    renderAll();
  }
  function begin(){
    $('gate').hidden=true; $('app').hidden=false;
    buildEditor(); renderAll();
    $('resetroom').hidden=(store.mode!=='cloud');
    if(store.mode==='cloud'){
      slow=setTimeout(function(){
        if(!firstSnap) setStatus('共有データにつながっていません。表示が古い可能性があります',true);
      },10000);
    }
    store.subscribe(onData,function(){
      clearTimeout(slow);
      setStatus('読み込めませんでした。通信を確認してください',true);
    });
  }
  function cloudReady(){
    var c=window.FIREBASE_CONFIG||{};
    return !!(c.apiKey&&c.apiKey!=='YOUR_API_KEY'&&c.projectId&&c.projectId!=='YOUR_PROJECT_ID'&&typeof firebase!=='undefined'&&!window.__fbFail);
  }
  function boot(){
    if(!cloudReady()){
      store=localStore();
      var c=window.FIREBASE_CONFIG||{};
      var unset=(!c.apiKey||c.apiKey==='YOUR_API_KEY');
      showBanner(unset
        ?'共有の設定がまだです。いまはこのスマホの中だけに保存されます。'
        :'共有サービスに接続できません。いまはこのスマホの中だけに保存されます。通信を確認して開き直してください。');
      begin(); return;
    }
    if(!(window.crypto&&crypto.subtle)){
      $('gate').hidden=false;
      $('gateerr').textContent='この環境では合言葉を使えません。https のアドレスで開いてください。';
      $('gatego').disabled=true; return;
    }
    var room=lsGet(ROOM_KEY);
    if(room&&/^[0-9a-f]{64}$/.test(room)){store=cloudStore(room);begin();return}
    $('gate').hidden=false;
    function go(){
      var pw=($('pass').value||'').normalize('NFKC').trim();
      if(pw.length<10){$('gateerr').textContent='合言葉は10文字以上にしてください。';return}
      $('gatego').disabled=true;
      sha('taichou-note:'+pw).then(function(h){
        if(!lsSet(ROOM_KEY,h)){$('gateerr').textContent='この端末では保存できません。プライベートブラウズを解除してください。';$('gatego').disabled=false;return}
        store=cloudStore(h); begin();
      });
    }
    $('gatego').addEventListener('click',go);
    $('pass').addEventListener('keydown',function(e){if(e.key==='Enter') go()});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
